name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  test-linux:
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: apt-get update -qq && apt-get install -y -qq git curl >/dev/null
      - run: swift test

  # The release build, including the Homebrew install test, on every PR.
  build:
    uses: ./.github/workflows/build.yml
