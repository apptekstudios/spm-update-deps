# Publishes a release when a version tag is pushed:
#   1. bump `toolVersion` in Sources/SPMUpdateCore/CLI.swift and merge
#   2. git tag v<version> && git push origin v<version>
# The tag must match toolVersion. Assets: macOS universal + static Linux x86_64/aarch64 tarballs
# and the Homebrew formula. If the HOMEBREW_TAP_TOKEN secret is set, the formula is also pushed to
# the tap repository (HOMEBREW_TAP variable, default apptekstudios/homebrew-tap).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches toolVersion
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG does not match toolVersion $VERSION in CLI.swift"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Formula and checksums
        run: |
          scripts/make-formula.sh "$VERSION" "https://github.com/${{ github.repository }}/releases/download/$TAG" dist > dist/spm-update.rb
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/spm-update.rb dist/SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS dist/spm-update.rb \
            --repo "${{ github.repository }}" --title "spm-update $VERSION" --generate-notes
      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP || 'apptekstudios/homebrew-tap' }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; the formula is attached to the release instead."
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPO.git" tap
          mkdir -p tap/Formula && cp dist/spm-update.rb tap/Formula/spm-update.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/spm-update.rb
          git commit -m "spm-update $VERSION"
          git push
